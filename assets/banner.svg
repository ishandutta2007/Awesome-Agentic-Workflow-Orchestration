<svg width="100%" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="purpleLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.75; transform: scale(1.08); }
    }
    @keyframes dashMove {
      from { stroke-dashoffset: 200; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes particleDrift1 {
      0% { transform: translate(0, 0); opacity: 0.2; }
      50% { transform: translate(40px, -20px); opacity: 0.8; }
      100% { transform: translate(80px, 0); opacity: 0.2; }
    }
    @keyframes particleDrift2 {
      0% { transform: translate(0, 0); opacity: 0.3; }
      50% { transform: translate(-30px, 25px); opacity: 0.9; }
      100% { transform: translate(-60px, 0); opacity: 0.3; }
    }
    @keyframes ringRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .grid-bg { opacity: 0.8; }
    .pulse-node { animation: pulseGlow 4s ease-in-out infinite; transform-origin: center; }
    .stream-line { stroke-dasharray: 8 12; animation: dashMove 6s linear infinite; }
    .reverse-stream { stroke-dasharray: 6 10; animation: dashMove 8s linear infinite reverse; }
    .drift-p1 { animation: particleDrift1 8s ease-in-out infinite; }
    .drift-p2 { animation: particleDrift2 7s ease-in-out infinite; }
    .orbit-ring { transform-origin: 1050px 130px; animation: ringRotate 20s linear infinite; }
    .orbit-ring-left { transform-origin: 150px 130px; animation: ringRotate 25s linear infinite reverse; }
    .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
    .sub-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; }
    .tag-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="260" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="260" rx="16" fill="url(#grid)" class="grid-bg" />

  <!-- Border Highlight -->
  <rect width="1198" height="258" x="1" y="1" rx="15" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.7"/>

  <!-- Dynamic / Animated Background Layer (Stays safely behind text) -->
  <g opacity="0.65">
    <!-- Left Agent Mesh Orbit -->
    <g class="orbit-ring-left">
      <circle cx="150" cy="130" r="75" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 8" opacity="0.4"/>
      <circle cx="225" cy="130" r="4" fill="#38bdf8" opacity="0.8"/>
      <circle cx="75" cy="130" r="3" fill="#818cf8" opacity="0.6"/>
    </g>

    <!-- Right Agent Mesh Orbit -->
    <g class="orbit-ring">
      <circle cx="1050" cy="130" r="85" fill="none" stroke="#c084fc" stroke-width="1" stroke-dasharray="6 10" opacity="0.4"/>
      <circle cx="1135" cy="130" r="5" fill="#c084fc" opacity="0.8"/>
      <circle cx="965" cy="130" r="3" fill="#38bdf8" opacity="0.6"/>
    </g>

    <!-- Dynamic Flow Streams connecting orchestrator nodes across canvas -->
    <path d="M 50 70 Q 300 20 600 70 T 1150 70" fill="none" stroke="url(#cyanLine)" stroke-width="2" class="stream-line" />
    <path d="M 50 190 Q 300 240 600 190 T 1150 190" fill="none" stroke="url(#purpleLine)" stroke-width="2" class="reverse-stream" />

    <!-- Ambient Floating Agent Nodes -->
    <g class="drift-p1">
      <circle cx="180" cy="50" r="14" fill="#0284c7" opacity="0.25" filter="url(#glowCyan)"/>
      <circle cx="180" cy="50" r="5" fill="#38bdf8" />
      <circle cx="1020" cy="210" r="16" fill="#9333ea" opacity="0.25" filter="url(#glowPurple)"/>
      <circle cx="1020" cy="210" r="6" fill="#c084fc" />
    </g>

    <g class="drift-p2">
      <circle cx="210" cy="210" r="18" fill="#4f46e5" opacity="0.25" filter="url(#glowPurple)"/>
      <circle cx="210" cy="210" r="6" fill="#818cf8" />
      <circle cx="990" cy="60" r="15" fill="#06b6d4" opacity="0.25" filter="url(#glowCyan)"/>
      <circle cx="990" cy="60" r="5" fill="#22d3ee" />
    </g>

    <!-- Central Soft Accent Glow -->
    <ellipse cx="600" cy="130" rx="350" ry="70" fill="#3b82f6" opacity="0.08" class="pulse-node" filter="url(#glowCyan)" />
  </g>

  <!-- FOREGROUND LAYER: Title, Subtitle, and Categorical Badges (Completely clear, unblocked) -->
  <g id="foreground-content">
    <!-- Category Pill Badge -->
    <g transform="translate(600, 46)">
      <rect x="-170" y="-14" width="340" height="28" rx="14" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.5"/>
      <text x="0" y="4" text-anchor="middle" fill="#38bdf8" font-size="12" class="tag-text" letter-spacing="1.5">⚡ ENTERPRISE &amp; OPEN-SOURCE AI AGENTS</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="112" text-anchor="middle" fill="url(#titleGrad)" font-size="36" class="title-text" letter-spacing="-0.5">
      Awesome Agentic Workflow Orchestration
    </text>

    <!-- Subtitle -->
    <text x="600" y="150" text-anchor="middle" fill="#94a3b8" font-size="15" class="sub-text" letter-spacing="0.2">
      Curated Ecosystem of Multi-Agent Systems, Autonomous LLM Workflows &amp; Tool Orchestration
    </text>

    <!-- Feature Pills / Highlights -->
    <g transform="translate(600, 202)">
      <!-- Pill 1: Multi-Agent -->
      <g transform="translate(-250, 0)">
        <rect x="-85" y="-14" width="170" height="28" rx="7" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="0" y="4" text-anchor="middle" fill="#cbd5e1" font-size="12" class="tag-text">🤖 Multi-Agent Systems</text>
      </g>
      <!-- Pill 2: Stateful Graphs -->
      <g transform="translate(-75, 0)">
        <rect x="-75" y="-14" width="150" height="28" rx="7" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="0" y="4" text-anchor="middle" fill="#cbd5e1" font-size="12" class="tag-text">🔄 Stateful Cycles</text>
      </g>
      <!-- Pill 3: Enterprise SaaS -->
      <g transform="translate(85, 0)">
        <rect x="-75" y="-14" width="150" height="28" rx="7" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="0" y="4" text-anchor="middle" fill="#cbd5e1" font-size="12" class="tag-text">🏢 Enterprise SaaS</text>
      </g>
      <!-- Pill 4: Open Source -->
      <g transform="translate(245, 0)">
        <rect x="-75" y="-14" width="150" height="28" rx="7" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="0" y="4" text-anchor="middle" fill="#cbd5e1" font-size="12" class="tag-text">⭐ Open-Source Core</text>
      </g>
    </g>
  </g>
</svg>
